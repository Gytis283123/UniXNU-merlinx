name: Build UniXNU kernel + boot image (merlinx, macOS)

on:
  workflow_dispatch:
    inputs:
      fetch_ipsw:
        description: 'Fetch iPadOS 17.7.11 21H461 restore image'
        type: boolean
        default: true

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "Using $XCODE_APP (26.6 not present)"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcrun --find clang || true

      - name: Install build tools
        run: |
          brew install llvm lld cmake ninja tcsh unifdef cpio mtools dtc gnu-sed rsync || true

      - name: Clone device repo (merlinx — hosts the vendored unixnu tool)
        run: git clone --recurse-submodules -b merlinx-work https://github.com/Dracen-W/UniXNU-merlinx UniXNU-device

      - name: Clone UniXNU core
        run: git clone --recurse-submodules https://github.com/UniXNU/UniXNU

      - name: Clone firmware repo
        run: git clone --recurse-submodules https://github.com/Dracen-W/uefi-merlinx uefi-device

      - name: Record source revisions
        run: |
          {
            echo "UniXNU-device $(git -C UniXNU-device rev-parse HEAD)"
            echo "UniXNU        $(git -C UniXNU rev-parse HEAD)"
            echo "uefi-device   $(git -C uefi-device rev-parse HEAD)"
            echo "Xcode         $(xcodebuild -version | tr '\n' ' ')"
          } | tee build-info.txt

      - name: Configure merlinx
        run: |
          cd UniXNU-device
          ./unixnu defconfig merlinx_defconfig -D .

      - name: Fetch pinned sources
        run: |
          cd UniXNU-device
          ./unixnu fetch -D .

      - name: Fetch OS profile
        if: ${{ inputs.fetch_ipsw }}
        run: |
          cd UniXNU-device
          ./unixnu ipsw info
          ./unixnu ipsw fetch

      - name: Assemble target tree
        run: |
          cd UniXNU-device
          ./unixnu tree

      - name: Build kernel
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-device
          # prepare-xnu-source.py lists Apple sources through the GitHub API; anonymous calls from hosted
          # runners hit the shared IP rate limit (HTTP 403), so send the workflow token.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          cd UniXNU-device
          ./unixnu build kernel 2>&1 | tee ../kernel-build.log

      - name: Build the UniXNU package and UEFI firmware
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-device
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-device
        run: |
          set -o pipefail
          cd UniXNU-device
          ./unixnu build package firmware 2>&1 | tee ../firmware-build.log

      - name: Build payload
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-device
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-device
          # 64-bit platform seed: with --chip-id it generates the IOPlatformUUID (gethostuuid() hangs
          # without it). Synthetic "merlinx1" placeholder; set a UNIXNU_UNIQUE_CHIP_ID secret to override.
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID || '6d65726c696e7831' }}
        run: |
          set -o pipefail
          cd UniXNU-device
          ./unixnu build payload 2>&1 | tee ../payload-build.log

      - name: Pack the boot image
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/UniXNU-device
          UNIXNU_UEFI: ${{ github.workspace }}/uefi-device
        run: |
          set -o pipefail
          cd UniXNU-device
          # merlinx builds its Apple ADT through the custom make-merlinx-adt.py, so the payload step
          # never writes the hardware DTB. Compile it here via the tool's own [device_tree] config
          # (dts/merlinx.dts with the soc profile include dirs), exactly like compile_hardware does.
          export DTB_FILE="$GITHUB_WORKSPACE/dtb-path.txt"
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from pathlib import Path
          from unixnu.cli import parser
          from unixnu.config import Context
          from unixnu.devicetree import compile_hardware
          ctx = Context(parser().parse_args(['status']))
          import os
          Path(os.environ['DTB_FILE']).write_text(str(compile_hardware(ctx)) + '\n')
          PY
          DTB=$(cat "$DTB_FILE")
          echo "device tree: $DTB"
          [ -n "$DTB" ] && [ -f "$DTB" ]
          ./unixnu bootimg --dtb "$DTB" 2>&1 | tee ../bootimg-build.log

      - name: Collect artifacts
        run: |
          cd UniXNU-device
          mkdir -p ../artifacts
          find out -name 'kernel.macho' -exec cp {} ../artifacts/ \;
          cp ../kernel-build.log ../build-info.txt ../artifacts/ 2>/dev/null || true
          find ../artifacts -name 'kernel.macho' -exec shasum -a 256 {} \; | tee ../artifacts/SHA256SUMS.txt
          ls -la ../artifacts

      - name: Collect boot artifacts
        run: |
          cd UniXNU-device
          mkdir -p ../boot-artifacts
          find out -name 'boot.img'    -exec cp {} ../boot-artifacts/ \;
          find out -name 'boot.json'   -exec cp {} ../boot-artifacts/ \;
          find out -name 'payload.img' -exec cp {} ../boot-artifacts/ \;
          find out -name 'payload.json' -exec cp {} ../boot-artifacts/ \;
          find ../uefi-device/Build -name 'SILICIUM_UEFI.fd' -exec cp {} ../boot-artifacts/ \;
          find out -path '*device-tree/hardware.dtb' -exec cp {} ../boot-artifacts/merlinx.dtb \;
          cp ../firmware-build.log ../payload-build.log ../bootimg-build.log ../build-info.txt ../boot-artifacts/ 2>/dev/null || true
          cd ../boot-artifacts
          shasum -a 256 -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -la

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlinx-kernel-macos
          path: artifacts/

      - name: Upload boot image artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlinx-boot-macos
          path: boot-artifacts/
          if-no-files-found: error
