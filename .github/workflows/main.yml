name: Build UniXNU kernel (merlinx, macOS)

on:
  workflow_dispatch:
    inputs:
      fetch_ipsw:
        description: 'Fetch iPadOS 17.7.11 21H461 restore image'
        type: boolean
        default: true

env:
  UNIXNU_DEVICE: ../UniXNU-device

jobs:
  kernel:
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          else
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
            echo "Using $XCODE_APP (26.6 not present)"
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
          xcrun --find clang || true

      - name: Install build tools
        run: |
          brew install cmake ninja tcsh unifdef cpio mtools dtc gnu-sed rsync || true

      - name: Clone UniXNU core
        run: git clone --recurse-submodules https://github.com/UniXNU/UniXNU

      - name: Pin core to pre-restructure revision (before 2026-11-03)
        run: |
          SHA=$(curl -sf "https://api.github.com/repos/UniXNU/UniXNU/commits?until=2026-11-03T00:00:00Z&per_page=1" \
                | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['sha'])" || true)
          if [ -n "$SHA" ]; then
            echo "Pinning UniXNU core to $SHA"
            git -C UniXNU checkout "$SHA"
            git -C UniXNU submodule update --init --recursive || true
          else
            echo "::warning::Could not resolve pin SHA via API; using core main HEAD"
          fi

      - name: Clone device repo (merlinx)
        run: git clone --recurse-submodules -b merlinx-work https://github.com/Dracen-W/UniXNU-merlinx UniXNU-device

      - name: Clone firmware repo
        run: git clone --recurse-submodules https://github.com/Dracen-W/uefi-merlinx uefi-device

      - name: Record source revisions
        run: |
          {
            echo "UniXNU        $(git -C UniXNU rev-parse HEAD)"
            echo "UniXNU-device $(git -C UniXNU-device rev-parse HEAD)"
            echo "uefi-device   $(git -C uefi-device rev-parse HEAD)"
            echo "Xcode         $(xcodebuild -version | tr '\n' ' ')"
            echo "Runner        $(sw_vers -productVersion 2>/dev/null || echo unknown)"
          } | tee build-info.txt

      - name: Write unixnu.local.toml
        run: |
          cd UniXNU
          cat > unixnu.local.toml <<'EOF'
          [build]
          device = "../UniXNU-device"
          uefi = "../uefi-device"
          EOF
          cat unixnu.local.toml

      - name: Configure merlinx
        run: |
          cd UniXNU
          ./unixnu defconfig merlinx_defconfig -D ../UniXNU-device

      - name: Fetch pinned sources
        run: |
          cd UniXNU
          ./unixnu fetch -D ../UniXNU-device

      - name: Fetch OS profile
        if: ${{ inputs.fetch_ipsw }}
        run: |
          cd UniXNU
          ./unixnu ipsw info
          ./unixnu ipsw fetch

      - name: Assemble target tree
        run: |
          cd UniXNU
          ./unixnu tree

      - name: Build kernel
        run: |
          cd UniXNU
          ./unixnu build kernel 2>&1 | tee ../kernel-build.log

      - name: Collect artifacts
        run: |
          cd UniXNU
          mkdir -p ../artifacts
          find out -name 'kernel.macho' -exec cp {} ../artifacts/ \;
          cp ../kernel-build.log ../build-info.txt ../artifacts/ 2>/dev/null || true
          find ../artifacts -name 'kernel.macho' -exec shasum -a 256 {} \; | tee ../artifacts/SHA256SUMS.txt
          ls -la ../artifacts

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: merlinx-kernel-macos
          path: artifacts/
